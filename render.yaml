# Render Blueprint: one web service (API + built React app) and a Postgres database.
# Deploy: Render dashboard → New → Blueprint → select this repository, then set GEMINI_API_KEY when prompted.
# The free plan sleeps after inactivity (first request then takes ~1 minute); use a paid plan for a demo people will click.
services:
  - type: web
    name: bookleaf-support
    runtime: node
    plan: free
    # Dev dependencies (TypeScript, Vite, Prisma CLI) are needed to build and to run migrations on start-up.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, seeds the BookLeaf dataset only if the database is empty, then starts the server.
    startCommand: npm run start:production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATA_AS_OF_DATE
        value: "2026-01-15"

databases:
  - name: bookleaf-db
    plan: free
